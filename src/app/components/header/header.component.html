<header class="header">
    <div class="logo">
      <!-- <img src="assets/logo.png" alt="Logo"> -->
    </div>
    
    <nav class="nav-buttons">
      <button class="btn primary" *ngIf="!isFormRoute" (click)="onAdd()">Add</button>
